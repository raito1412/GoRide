# MySQL dùng chung schema cho mọi máy: clone repo -> cp .env.example .env -> docker compose up -d
# Các file trong ./database chạy tự động theo thứ tự tên file ở lần khởi tạo đầu tiên.
# Reset DB về dữ liệu mẫu: docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: goride-mysql-02
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - goride_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

volumes:
  goride_data:
